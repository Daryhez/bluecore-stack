# Plain HTTP on port 80 for testing a host by IP (or any name) before its
# domain and certificate exist. Select it with NGINX_SERVER_CONF=ip-test.conf
# and HOSTNAME=<ip> in .env.
listen 80;

# Marva only uses its Blue Core config (relative /marva/util/ etc.) when the
# page URL is localhost or one of the hard-coded bcld.info/stanford.edu URLs in
# marva_editor's isBluecoreMarva(); anything else falls back to its dev config,
# which sends logins to http://localhost:9401/marva/util/auth/login. Rewrite
# one allow-list entry in the served JS so this host counts as Blue Core.
# ${HOSTNAME} is filled in by nginx's envsubst-on-templates step.
sub_filter 'https://bcld.info/marva/' 'http://${HOSTNAME}/marva/';
sub_filter_once off;
sub_filter_types application/javascript;
